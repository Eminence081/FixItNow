{% extends "core/base.html" %}
{% block content %}
<div class="container py-5" style="max-width:640px;">
  <div class="card-plain p-4 p-md-5">
    <h1 class="h3 mb-4">{{ title }}</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3"><label class="form-label">Category</label>{{ form.category }}</div>
      <div class="mb-3"><label class="form-label">Title</label>{{ form.title }}</div>
      <div class="mb-3"><label class="form-label">Description</label>{{ form.description }}</div>
      <div class="row g-3 mb-3">
        <div class="col-md-6"><label class="form-label">Price (₦)</label>{{ form.price }}</div>
        <div class="col-md-6"><label class="form-label">Duration (minutes)</label>{{ form.duration_minutes }}</div>
      </div>
      <div class="mb-3"><label class="form-label">City</label>{{ form.city }}</div>
      <div class="mb-3"><label class="form-label">Photo</label>{{ form.image }}</div>
      <div class="form-check mb-4">
        {{ form.is_active }}
        <label class="form-check-label">Active (visible to clients)</label>
      </div>
      <button type="submit" class="btn btn-accent w-100">Save service</button>
    </form>
  </div>
</div>
{% endblock %}
