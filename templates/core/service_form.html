{% extends "core/base.html" %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card-plain p-4 p-md-5">
        <div class="section-heading d-flex justify-content-between align-items-center gap-3 flex-wrap">
          <div>
            <span class="badge-cat">Service setup</span>
            <h1 class="h3 mt-3 mb-0">{{ title }}</h1>
          </div>
        </div>

        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="row g-3">
            <div class="col-md-6 mb-3">
              <label class="form-label">Category</label>
              {{ form.category }}
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Title</label>
              {{ form.title }}
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            {{ form.description }}
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label">Price (₦)</label>
              {{ form.price }}
            </div>
            <div class="col-md-4">
              <label class="form-label">Duration (minutes)</label>
              {{ form.duration_minutes }}
            </div>
            <div class="col-md-4">
              <label class="form-label">City</label>
              {{ form.city }}
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Photo</label>
            {{ form.image }}
          </div>
          <div class="form-check form-switch mb-4">
            {{ form.is_active }}
            <label class="form-check-label">Service is active and visible to clients</label>
          </div>
          <button type="submit" class="btn btn-accent w-100">Save service</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
