{% extends "core/base.html" %}
{% block content %}
<div class="container py-5" style="max-width:520px;">
  <div class="card-plain p-4 p-md-5">
    <h1 class="h3 mb-1">Review: {{ booking.service.title }}</h1>
    <p class="text-muted mb-4">How was your experience with {{ booking.service.provider.get_full_name|default:booking.service.provider.username }}?</p>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3"><label class="form-label">Rating</label>{{ form.rating }}</div>
      <div class="mb-4"><label class="form-label">Comment</label>{{ form.comment }}</div>
      <button type="submit" class="btn btn-accent w-100">Submit review</button>
    </form>
  </div>
</div>
{% endblock %}
