{% extends "core/base.html" %}
{% block content %}
<div class="container py-5" style="max-width:420px;">
  <div class="card-plain p-4 p-md-5">
    <h1 class="h3 mb-4">Log in</h1>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        {{ form.username }}
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        {{ form.password }}
      </div>
      {% if form.errors %}
        <div class="alert alert-danger small">Incorrect username or password.</div>
      {% endif %}
      <button type="submit" class="btn btn-accent w-100">Log in</button>
    </form>
    <p class="text-center small text-muted mt-3">New here? <a href="{% url 'register' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
