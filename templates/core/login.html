{% extends "core/base.html" %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-4 col-md-6">
      <div class="card-plain p-4 p-md-5">
        <div class="text-center mb-4">
          <span class="badge-cat">Welcome back</span>
          <h1 class="h3 mt-3 mb-0">Log in</h1>
        </div>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            {{ form.username }}
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            {{ form.password }}
          </div>
          {% if form.errors %}
            <div class="alert alert-danger small rounded-4">Incorrect username or password.</div>
          {% endif %}
          <button type="submit" class="btn btn-accent w-100">Log in</button>
        </form>
        <p class="text-center small text-muted mt-3">New here? <a href="{% url 'register' %}">Create an account</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
