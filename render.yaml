databases:
  - name: fixitnow-db
    databaseName: fixitnow
    user: fixitnow
    plan: free

services:
  - type: web
    name: fixitnow
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_demo"
    startCommand: "gunicorn fixitnow.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: fixitnow-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13.0"